services:
  - type: web
    name: phenesty-ai-video-studio
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_VIDEO_MODEL
        value: Wan-AI/Wan2.2-TI2V-5B
      - key: HF_VIDEO_PROVIDER
        value: fal-ai
