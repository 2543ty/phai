services:
  - type: web
    name: phenesty-ai-video-studio
    runtime: python
    plan: free
    buildCommand: python3 -m pip install --upgrade pip && python3 -m pip install --no-cache-dir -r requirements.txt && python3 -c "import gunicorn; print('Gunicorn installed:', gunicorn.__version__)"
    startCommand: python3 -m gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_VIDEO_MODEL
        value: Wan-AI/Wan2.2-TI2V-5B
      - key: HF_VIDEO_PROVIDER
        value: fal-ai
